data:
  data_dir: data/weargait_pd
  imu_channels: 12
  num_classes: 2
  pressure_grid_size:
  - 4
  - 8
  stride: 256
  window: 128
model:
  classifier:
    dropout: 0.3
    hidden_dims:
    - 64
  fusion:
    dropout: 0.2
    embed_dim: 64
    ff_dim: 128
    num_heads: 4
    num_layers: 1
  imu_encoder:
    conv_channels:
    - 16
    - 32
    dropout: 0.3
    kernel_size: 5
    lstm_hidden: 64
    lstm_layers: 1
  pressure_encoder:
    conv_channels:
    - 8
    - 16
    dropout: 0.3
    kernel_size: 3
training:
  batch_size: 16
  early_stopping:
    min_delta: 0.005
    patience: 2
  epochs: 2
  learning_rate: 0.001
  scheduler:
    type: cosine
    warmup_epochs: 1
  weight_decay: 0.0001
validation:
  metrics:
  - accuracy
  - f1_macro
  - precision
  - recall
  - confusion_matrix
